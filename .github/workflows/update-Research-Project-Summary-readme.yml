name: Update Research Project Summary README

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Download Research Project Summary README
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/yilingyang843-tech/Research-Project-Summary/main/README.md \
            -o research_project_summary_readme.md

      - name: Insert Research Project Summary README into profile README
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          profile_path = Path("README.md")
          project_path = Path("research_project_summary_readme.md")

          profile = profile_path.read_text(encoding="utf-8")
          project = project_path.read_text(encoding="utf-8")

          repo_blob_base = (
              "https://github.com/"
              "yilingyang843-tech/"
              "Research-Project-Summary/"
              "blob/main/"
          )

          repo_raw_base = (
              "https://raw.githubusercontent.com/"
              "yilingyang843-tech/"
              "Research-Project-Summary/"
              "main/"
          )

          # Convert relative image paths to absolute raw GitHub URLs
          project = re.sub(
              r'!\[([^\]]*)\]\((?!https?://|#)([^)]+)\)',
              lambda m: (
                  '!['
                  + m.group(1)
                  + ']('
                  + repo_raw_base
                  + m.group(2).lstrip('./')
                  + ')'
              ),
              project
          )

          # Convert relative Markdown links such as Code / Report
          # to absolute links in Research-Project-Summary
          project = re.sub(
              r'(?<!!)\[([^\]]+)\]\((?!https?://|#|mailto:)([^)]+)\)',
              lambda m: (
                  '['
                  + m.group(1)
                  + ']('
                  + repo_blob_base
                  + m.group(2).lstrip('./')
                  + ')'
              ),
              project
          )

          start_marker = "<!-- RESEARCH-PROJECT-SUMMARY:START -->"
          end_marker = "<!-- RESEARCH-PROJECT-SUMMARY:END -->"

          if start_marker not in profile:
              raise ValueError(
                  "START marker not found in profile README."
              )

          if end_marker not in profile:
              raise ValueError(
                  "END marker not found in profile README."
              )

          start = profile.index(start_marker) + len(start_marker)
          end = profile.index(end_marker)

          new_profile = (
              profile[:start]
              + "\n\n"
              + project
              + "\n\n"
              + profile[end:]
          )

          profile_path.write_text(
              new_profile,
              encoding="utf-8"
          )
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Research Project Summary README"
            git push
          fi















